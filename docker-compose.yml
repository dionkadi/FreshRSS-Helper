services:
  subscription-helper:
    build: .
    container_name: subscription-helper
    ports:
      - "8081:8081"
    networks:
      # 保留本项目默认网络
      - default
      # 加入 FreshRSS 所在网络（这样 freshrss / rsshub 服务名才能被 Docker DNS 解析；
      # 若你的 FreshRSS 网络名不同，用 docker network ls 查看后改成实际名称）
      - freshrss_default
    environment:
      # FreshRSS 基础地址（容器内访问 FreshRSS 容器名）
      FRESHRSS_BASE_URL: ${FRESHRSS_BASE_URL:-http://freshrss}
      # FreshRSS 用户名
      FRESHRSS_USER: ${FRESHRSS_USER:-}
      # FreshRSS API 密码（注意：不是登录密码）
      FRESHRSS_API_PASSWORD: ${FRESHRSS_API_PASSWORD:-}
      # RSSHub 基础地址（RSSHub 容器内部地址）
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-http://rsshub:1200}
      # 服务监听端口
      PORT: ${PORT:-8081}
    restart: unless-stopped

# 外部网络声明：该网络由 FreshRSS 的 compose 项目创建，这里只加入、不创建
networks:
  freshrss_default:
    external: true
